<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Grupo 08 - DevOps ISY2201</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 40px 16px; text-align: center; color: #333; }
        .caja { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        h1 { margin-top: 0; }
        .entorno { display: inline-block; padding: 6px 14px; border-radius: 16px; font-weight: bold; color: #fff; background: #777; }
        .entorno.desarrollo { background: #1f6feb; }
        .entorno.produccion { background: #2da44e; }
        table { margin: 24px auto 0; border-collapse: collapse; }
        td { padding: 6px 12px; border-bottom: 1px solid #eee; text-align: left; }
        p.nota { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Tienda en linea - Grupo 08</h1>
        <span id="entorno" class="entorno">cargando...</span>
        <table>
            <tr><td>Version</td><td id="version">-</td></tr>
            <tr><td>Entorno</td><td id="entorno-txt">-</td></tr>
        </table>
        <p>Despacho gratis en compras sobre $30.000 en la Region Metropolitana.</p>
        <p class="nota">Desplegado con Azure Pipelines (CI/CD) desde Azure Container Registry. DevOps ISY2201, Semana 7.</p>
    </div>
    <script>
        fetch('/estado')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var e = document.getElementById('entorno');
                e.textContent = d.entorno;
                e.className = 'entorno ' + d.entorno;
                document.getElementById('version').textContent = d.version;
                document.getElementById('entorno-txt').textContent = d.entorno;
            })
            .catch(function () { document.getElementById('entorno').textContent = 'sin datos'; });
    </script>
</body>
</html>
